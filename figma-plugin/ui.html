<!-- Sygma — the designer's authoring surface.
     A link says: this part of the design system feeds that Unreal project.
     Links live in the Figma file, so every designer sees the same set.
     Publishing stores the tokens in this Figma file, where Unreal pulls them;
     the downloadable file remains as a fallback. The only network access is the
     live link: a push to an Unreal editor on this machine, on localhost. -->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px 14px 20px;
    font: 11px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #1c1b1a; background: #fff;
  }
  @media (prefers-color-scheme: dark) { body { color: #e8e5da; background: #2c2c2c; } }

  h1 { font-size: 12px; font-weight: 600; margin: 0 0 1px; }
  h2 {
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em;
    opacity: .6; margin: 18px 0 7px;
  }
  p.sub { opacity: .6; margin: 0 0 12px; }
  code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; }

  button {
    padding: 7px 11px; border-radius: 6px; border: 0; cursor: pointer;
    font: inherit; font-weight: 600; background: #0d99ff; color: #fff;
  }
  button:hover:not(:disabled) { background: #0b87e3; }
  button:disabled { opacity: .45; cursor: default; }
  button.sec { background: transparent; color: inherit; border: 1px solid rgba(128,128,128,.45); font-weight: 500; }
  button.sec:hover:not(:disabled) { background: rgba(128,128,128,.13); }
  button.tiny { padding: 4px 8px; font-size: 10px; font-weight: 500; }
  button.danger { color: #c7002e; }
  .wide { width: 100%; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row.end { justify-content: flex-end; }

  label { display: block; font-weight: 500; margin: 9px 0 3px; }
  label .hint { font-weight: 400; opacity: .55; }
  input[type=text] {
    width: 100%; padding: 6px 8px; border-radius: 5px; font: inherit;
    border: 1px solid rgba(128,128,128,.45); background: transparent; color: inherit;
  }
  input[type=text]:focus { outline: 2px solid #0d99ff; outline-offset: -1px; border-color: transparent; }
  input.bad { border-color: #c7002e; }

  .card {
    border: 1px solid rgba(128,128,128,.32); border-radius: 7px;
    padding: 10px 11px; margin-bottom: 7px;
  }
  .card.active { border-color: #0d99ff; }
  .card h3 { font-size: 11.5px; font-weight: 600; margin: 0 0 2px; }
  .card .meta { opacity: .6; font-size: 10px; margin-bottom: 8px; }
  .card .meta div { margin-top: 1px; }

  .groups { max-height: 190px; overflow-y: auto; border: 1px solid rgba(128,128,128,.3); border-radius: 6px; padding: 6px 8px; }
  .groups .tierhead { font-weight: 600; margin: 6px 0 2px; opacity: .75; }
  .groups .tierhead:first-child { margin-top: 0; }
  .chk { display: flex; align-items: center; gap: 7px; padding: 2px 0 2px 10px; }
  .chk input { margin: 0; }
  .chk .n { flex: 1; }
  .chk .c { opacity: .5; font-variant-numeric: tabular-nums; }

  .msg { margin-top: 9px; padding: 8px 9px; border-radius: 5px; font-size: 10.5px; }
  .msg.err  { background: rgba(199,0,46,.12);  border: 1px solid rgba(199,0,46,.5); }
  .msg.warn { background: rgba(217,138,0,.13); border: 1px solid rgba(217,138,0,.5); }
  .msg.ok   { background: rgba(7,159,54,.12);  border: 1px solid rgba(7,159,54,.5); }
  .msg ul { margin: 4px 0 0; padding-left: 15px; }
  .msg li { margin-bottom: 2px; }

  .stat { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(128,128,128,.18); }
  .stat b { font-variant-numeric: tabular-nums; }
  .chg { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid rgba(128,128,128,.18); }
  .chg .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chg .k { opacity: .55; font-size: 10px; min-width: 64px; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(128,128,128,.55); flex: none; }
  .sw.none { border-style: dashed; }
  details.msg summary { cursor: pointer; }
  .empty { opacity: .55; padding: 10px 0; }
  .hide { display: none; }
</style>

<h1>Sygma</h1>
<p class="sub" id="fileline">Loading…</p>

<div class="row">
  <button id="scan" class="wide">Scan this file</button>
</div>
<div id="scanReport"></div>

<h2>Unreal links</h2>
<div id="links"></div>
<div class="row">
  <button id="add" class="sec wide">New link…</button>
  <button id="publishAll" class="sec wide hide">Publish all</button>
</div>

<h2>Live link <span style="text-transform:none;letter-spacing:0">— this computer only</span></h2>
<p class="sub">Push straight into an Unreal editor open on this computer. In Unreal, use
  Tools › Copy Live Link Pairing Code and paste it here. Once per computer.</p>
<div id="pairings"></div>
<div class="row">
  <input type="text" id="pairingCode" placeholder="ftb1:30871:…" autocomplete="off" spellcheck="false">
  <button id="pair" class="sec">Pair</button>
</div>
<div id="pairMsg"></div>

<div id="editor" class="hide">
  <h2 id="editorTitle">New link</h2>
  <div class="card">
    <label>Link name <span class="hint">— what this link is for</span></label>
    <input type="text" id="linkName" placeholder="Clinical Sim — main UI">

    <label>Unreal project id <span class="hint">— Project Settings › Plugins › Sygma</span></label>
    <input type="text" id="projectId" placeholder="A1B2C3D4-E5F6-7890-ABCD-EF1234567890">

    <label>Unreal project name <span class="hint">— optional, for reading the file</span></label>
    <input type="text" id="projectName" placeholder="ClinicalSim">

    <label>Figma file key <span class="hint">— from this file’s URL, after /design/</span></label>
    <input type="text" id="fileKey" placeholder="FruupulmvbUZbkUlTQ0kIm">

    <label>Publish to Unreal <span class="hint">— what this project may use</span></label>
    <div id="groups" class="groups"><div class="empty">Scan the file first.</div></div>

    <div class="row end" style="margin-top:10px">
      <button id="cancel" class="sec">Cancel</button>
      <button id="save">Save link</button>
    </div>
    <div id="editorMsg"></div>
  </div>
</div>

<div id="exportReport"></div>

<script>
  var state = { links: [], activeLinkId: null, inventory: null, readMode: null, total: 0, editing: null, doc: null, fileKey: null, publications: {}, pairings: {} };

  /** Same rule as normaliseProjectId in code.js, which keys the pairings. */
  function normId(id) { return String(id || '').replace(/[{}-]/g, '').trim().toUpperCase(); }

  /** "3 min ago", falling back to the date once it stops being recent. */
  function ago(iso) {
    var s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
    if (isNaN(s)) return iso;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return new Date(iso).toLocaleDateString();
  }

  function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; }
  function $(id) { return document.getElementById(id); }
  function send(m) { parent.postMessage({ pluginMessage: m }, '*'); }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  function msg(kind, title, items) {
    var d = el('div', 'msg ' + kind);
    d.appendChild(el('div', null, title));
    if (items && items.length) {
      var ul = el('ul');
      items.slice(0, 10).forEach(function (i) { ul.appendChild(el('li', null, i)); });
      if (items.length > 10) ul.appendChild(el('li', null, '…and ' + (items.length - 10) + ' more'));
      d.appendChild(ul);
    }
    return d;
  }

  function stat(k, v) {
    var d = el('div', 'stat');
    d.appendChild(el('span', null, k));
    d.appendChild(el('b', null, String(v)));
    return d;
  }

  /* ------------------------------- links list ----------------------------- */

  function renderLinks() {
    var host = $('links');
    clear(host);

    $('publishAll').classList.toggle('hide', state.links.length < 2);

    if (!state.links.length) {
      host.appendChild(el('div', 'empty', 'No links yet. A link says which parts of this design system feed which Unreal project.'));
      return;
    }

    state.links.forEach(function (link) {
      var card = el('div', 'card' + (link.id === state.activeLinkId ? ' active' : ''));
      card.appendChild(el('h3', null, link.linkName));

      var meta = el('div', 'meta');
      meta.appendChild(el('div', null, (link.projectName || 'project') + ' · ' + link.projectId));
      if (link.fileKey) meta.appendChild(el('div', null, 'from file ' + link.fileKey));
      meta.appendChild(el('div', null, 'publishes ' + link.published.join(', ')));
      if (link.linkedBy) meta.appendChild(el('div', null, 'linked by ' + link.linkedBy));
      var pub = state.publications[link.id];
      meta.appendChild(el('div', null, pub
        ? 'published ' + ago(pub.publishedAt) + (pub.publishedBy ? ' by ' + pub.publishedBy : '') +
          (pub.publishedCount !== null && pub.publishedCount !== undefined ? ' · ' + pub.publishedCount + ' tokens' : '')
        : 'not published yet — Unreal has nothing to sync'));
      card.appendChild(meta);

      var row = el('div', 'row');
      var publishBtn = el('button', 'tiny', 'Publish to Unreal');
      publishBtn.onclick = function () {
        publishBtn.disabled = true;
        publishBtn.textContent = 'Publishing…';
        send({ type: 'publish', id: link.id });
      };
      row.appendChild(publishBtn);

      if (state.pairings[normId(link.projectId)]) {
        var pushBtn = el('button', 'tiny sec', 'Push live');
        pushBtn.title = 'Send the tokens straight to the Unreal editor open on this computer';
        pushBtn.onclick = function () {
          pushBtn.disabled = true;
          pushBtn.textContent = 'Pushing…';
          send({ type: 'pushLive', id: link.id });
        };
        row.appendChild(pushBtn);
      }

      // Kept for review outside Figma, or a project that is not pulling yet.
      var exportBtn = el('button', 'tiny sec', 'Export file');
      exportBtn.onclick = function () { send({ type: 'export', id: link.id }); };
      row.appendChild(exportBtn);

      var editBtn = el('button', 'tiny sec', 'Edit');
      editBtn.onclick = function () { openEditor(link); };
      row.appendChild(editBtn);

      var delBtn = el('button', 'tiny sec danger', 'Delete');
      delBtn.onclick = function () { send({ type: 'deleteLink', id: link.id }); };
      row.appendChild(delBtn);

      card.appendChild(row);
      host.appendChild(card);
    });
  }

  /* -------------------------------- editor -------------------------------- */

  function renderGroups(selected) {
    var host = $('groups');
    clear(host);

    if (!state.inventory) {
      host.appendChild(el('div', 'empty', 'Scan the file first.'));
      return;
    }

    var chosen = {};
    (selected || []).forEach(function (s) { chosen[s] = true; });

    var lastTier = null;
    state.inventory.forEach(function (item) {
      if (item.tier !== lastTier) {
        lastTier = item.tier;
        var head = el('div', 'tierhead', item.tier);
        host.appendChild(head);
      }

      var wrap = el('label', 'chk');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = item.path;
      cb.checked = !!chosen[item.path] || !!chosen[item.tier];
      wrap.appendChild(cb);
      wrap.appendChild(el('span', 'n', item.group || '(no group)'));
      wrap.appendChild(el('span', 'c', item.count));
      host.appendChild(wrap);
    });
  }

  /** draft: a new link's starting values, from "Link this project". */
  function openEditor(link, draft) {
    var from = link || draft;
    state.editing = link || null;
    $('editorTitle').textContent = link ? 'Edit link' : 'New link';
    $('linkName').value = from ? from.linkName : '';
    $('projectId').value = from ? from.projectId : '';
    $('projectName').value = from ? from.projectName : '';
    // Prefilled from the API when the plugin is allowed to read it, which only
    // private org plugins are. Otherwise the designer confirms it from the URL.
    $('fileKey').value = (from && from.fileKey) || state.fileKey || '';
    $('projectId').classList.remove('bad');
    $('fileKey').classList.remove('bad');
    clear($('editorMsg'));
    if (draft && draft.warning) $('editorMsg').appendChild(msg('warn', draft.warning));
    // Default a new link to the Component tier, matching the board's own advice.
    renderGroups(link ? link.published : (state.inventory ? ['Component'] : []));
    $('editor').classList.remove('hide');
    // The form sits below the links and the live link, often off screen.
    $('editor').scrollIntoView({ block: 'start', behavior: 'smooth' });
    $('linkName').focus({ preventScroll: true });  // a focus scroll would cancel the one above
  }

  function closeEditor() {
    state.editing = null;
    $('editor').classList.add('hide');
  }

  $('add').onclick = function () { openEditor(null); };
  $('publishAll').onclick = function () {
    this.disabled = true;
    send({ type: 'publish' });
  };
  $('cancel').onclick = closeEditor;

  $('save').onclick = function () {
    var boxes = $('groups').querySelectorAll('input[type=checkbox]');
    var published = [];
    for (var i = 0; i < boxes.length; i++) {
      if (boxes[i].checked) published.push(boxes[i].value);
    }

    clear($('editorMsg'));
    if (!published.length) {
      $('editorMsg').appendChild(msg('err', 'Select at least one group to publish.'));
      return;
    }

    send({
      type: 'saveLink',
      link: {
        id: state.editing ? state.editing.id : null,
        linkName: $('linkName').value.trim(),
        fileKey: $('fileKey').value.trim(),
        projectId: $('projectId').value.trim(),
        projectName: $('projectName').value.trim(),
        published: published
      }
    });
  };

  $('scan').onclick = function () {
    this.disabled = true;
    this.textContent = 'Scanning…';
    send({ type: 'scan' });
  };

  /* ------------------------------- live link ------------------------------ */

  function renderPairings() {
    var host = $('pairings');
    clear(host);
    Object.keys(state.pairings).forEach(function (key) {
      var p = state.pairings[key];
      var row = el('div', 'stat');
      row.appendChild(el('span', null, (p.projectName || p.projectId) + ' · port ' + p.port + ' · paired ' + ago(p.pairedAt)));
      // The pairing already knows everything the link form asks for, so a
      // project with no link yet is one click away from having one.
      var linked = state.links.some(function (l) { return normId(l.projectId) === key; });
      if (!linked && p.linkDefaults) {
        var linkBtn = el('button', 'tiny', 'Link this project');
        linkBtn.title = 'Create a link to this Unreal project, filled in from the pairing';
        linkBtn.onclick = function () { openEditor(null, p.linkDefaults); };
        row.appendChild(linkBtn);
      }
      var forget = el('button', 'tiny sec danger', 'Forget');
      forget.onclick = function () { send({ type: 'forgetPairing', key: key }); };
      row.appendChild(forget);
      host.appendChild(row);
    });
  }

  function pairMessage(node) {
    clear($('pairMsg'));
    if (node) $('pairMsg').appendChild(node);
  }

  /**
   * The editor answers every request with JSON, refusals included. A failure
   * to connect at all means nothing is listening, which is the common case and
   * gets its own explanation.
   */
  function callEditor(url, secret, body) {
    var headers = { 'Authorization': 'Bearer ' + secret };
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    return fetch(url, { method: body === undefined ? 'GET' : 'POST', headers: headers, body: body })
      .then(function (r) {
        return r.json().catch(function () {
          return { ok: false, errors: ['Unreal answered ' + r.status + ' without a readable reply.'] };
        });
      }, function () {
        var port = url.split(':')[2].split('/')[0];
        return { ok: false, unreachable: true, errors: [
          'Could not reach Unreal on port ' + port + '. Is the project open, with Tools › Figma Live Link ticked?',
          'If you are using Figma in a browser, try the desktop app.'
        ] };
      });
  }

  $('pair').onclick = function () {
    var code = $('pairingCode').value.trim();
    if (!code) return;
    this.disabled = true;
    pairMessage(null);
    send({ type: 'checkPairing', code: code });
  };

  /** A colour chip for "#RRGGBB" or "#RRGGBB 80%"; a dashed empty chip when there is none. */
  function swatch(value) {
    var s = el('span', 'sw');
    var match = /^#([0-9A-Fa-f]{6})(?:\s+(\d+)%)?$/.exec(String(value || ''));
    if (!match) {
      s.className = 'sw none';
      return s;
    }
    var n = parseInt(match[1], 16);
    var alpha = match[2] ? Number(match[2]) / 100 : 1;
    s.style.background = 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
    s.title = value;
    return s;
  }

  var KIND_LABEL = { added: 'Added', updated: 'Updated', renamed: 'Renamed', deprecated: 'Gone from Figma' };

  /**
   * Up to 20 rows of before → after. total is how many changes there were:
   * Unreal sends at most 200, and its Output Log has every one.
   */
  function renderChanges(host, changes, total) {
    changes.slice(0, 20).forEach(function (c) {
      var row = el('div', 'chg');
      row.appendChild(el('span', 'k', KIND_LABEL[c.kind] || c.kind));
      row.appendChild(swatch(c.before));
      row.appendChild(el('span', null, '→'));
      row.appendChild(swatch(c.after));
      var name = el('span', 'n', c.kind === 'renamed' && c.oldName ? c.oldName + ' → ' + c.name : c.name);
      name.title = name.textContent + (c.before ? '  ' + c.before : '') + (c.after ? ' → ' + c.after : '');
      row.appendChild(name);
      host.appendChild(row);
    });
    if (total > 20) {
      host.appendChild(el('div', 'empty', '…and ' + (total - 20) + ' more. Unreal’s Output Log (LogFigmaTokens) has the full list.'));
    }
  }

  function showPush(m, res) {
    var out = $('exportReport');
    clear(out);
    out.appendChild(el('h2', null, 'Live push — ' + m.link.linkName));
    if (!res.ok) {
      var title = res.notSent ? 'Not pushed. Fix these first:'
        : res.unreachable ? 'Not pushed.'
        : 'Unreal did not import it. It keeps the tokens it had:';
      out.appendChild(msg('err', title, res.errors || []));
    } else {
      // The headline and the change list first: "did my colour land?" is the
      // question, and the counts below only matter once that is answered.
      var changes = res.changes || [];
      var project = m.projectName || 'Unreal';
      var parts = [];
      if (res.updated) parts.push(res.updated + ' updated');
      if (res.added) parts.push(res.added + ' added');
      if (res.renamed) parts.push(res.renamed + ' renamed');
      // An older editor sends neither count; the list it sends is then complete.
      var newlyGone = res.newlyGone !== undefined ? res.newlyGone
        : changes.filter(function (c) { return c.kind === 'deprecated'; }).length;
      if (newlyGone) parts.push(newlyGone + ' no longer in Figma');
      // What Unreal wrote decides the headline, not the counts: a renamed or
      // re-saved link changes no token but still rewrites the asset.
      var wrote = res.wroteAsset !== undefined ? (res.wroteAsset || res.wroteTokensFile) : parts.length > 0;

      var ok = el('div', 'msg ok');
      ok.appendChild(el('div', null, parts.length
        ? 'Imported into ' + project + ': ' + parts.join(', ') + '. Its tokens.json is updated for review, the same as after a Sync.'
        : wrote
          ? 'Imported into ' + project + '. No colour changed, but Unreal rewrote its token files (the link details changed, or a file was missing). Review them as after any Sync.'
          : 'Already up to date in ' + project + '. Nothing was written.'));
      out.appendChild(ok);
      renderChanges(out, changes, res.changeCount !== undefined ? res.changeCount : changes.length);

      out.appendChild(stat('Added', res.added));
      out.appendChild(stat('Updated', res.updated));
      out.appendChild(stat('Unchanged', res.unchanged));
      if (res.renamed) out.appendChild(stat('Renamed', res.renamed));
      if (res.deprecated) out.appendChild(stat('No longer in Figma', res.deprecated));
      if (m.readMode === 'consumer') {
        out.appendChild(msg('warn',
          'Read from a consuming file, so only variables bound on this page were pushed. Push from the library file for the full set.'));
      }
    }
    var warnings = (m.warnings || []).concat(res.warnings || []);
    if (warnings.length) out.appendChild(msg('warn', 'Warnings:', warnings));
    // The report renders at the bottom; without this a push looks like it did nothing.
    out.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  /* ------------------------------- messages ------------------------------- */

  onmessage = function (e) {
    var m = e.data.pluginMessage;
    if (!m) return;

    if (m.type === 'init') {
      state.fileKey = m.fileKey;
      $('fileline').textContent = m.fileName +
        (m.fileKey ? ' · ' + m.fileKey : ' · file key unavailable — enter it when linking');
      state.links = m.links;
      state.activeLinkId = m.activeLinkId;
      state.publications = m.publications || {};
      state.pairings = m.pairings || {};
      renderLinks();
      renderPairings();
      return;
    }

    if (m.type === 'pairResult') {
      $('pair').disabled = false;
      pairMessage(msg('err', m.error));
      return;
    }

    // The code is well-formed; ask the editor who it is before keeping it, so a
    // pairing is only ever stored against the project that actually answered.
    if (m.type === 'pairProbe') {
      callEditor(m.url, m.secret).then(function (hello) {
        if (!hello.ok) {
          $('pair').disabled = false;
          pairMessage(msg('err', 'Not paired.', hello.errors || []));
          return;
        }
        send({ type: 'savePairing', port: m.port, secret: m.secret, hello: hello });
      });
      return;
    }

    if (m.type === 'pairings') {
      $('pair').disabled = false;
      state.pairings = m.pairings || {};
      if (m.paired) {
        $('pairingCode').value = '';
        pairMessage(msg('ok', 'Paired with ' + m.paired + '. Links to that project now have a Push live button.'));
      }
      renderPairings();
      renderLinks();
      return;
    }

    if (m.type === 'liveDoc') {
      var done = function (res) {
        renderLinks();  // re-enables the button left saying "Pushing…"
        showPush(m, res);
      };
      if (m.errors.length) {
        done({ ok: false, notSent: true, errors: m.errors });
        return;
      }
      callEditor(m.url, m.secret, JSON.stringify(m.doc)).then(done);
      return;
    }

    if (m.type === 'scan') {
      $('scan').disabled = false;
      $('scan').textContent = 'Re-scan this file';
      state.inventory = m.inventory;
      state.readMode = m.readMode;
      state.total = m.total;

      var host = $('scanReport');
      clear(host);
      host.appendChild(stat('Read mode', m.readMode === 'local' ? 'library file' : 'consuming file'));
      host.appendChild(stat('Variables found', m.total));

      if (m.total === 0) {
        // The most likely first-run state in a brand new file. Saying what is
        // missing beats an empty group list the designer has to interpret.
        host.appendChild(msg('err', 'No colour variables found in this file.', [
          'If this file should own the design system, create colour variables named Global/…, Semantic/… and Component/….',
          'If it subscribes to a library, the scan only finds variables bound to something on the current page — open the library file instead.'
        ]));
      } else if (m.readMode === 'consumer') {
        host.appendChild(msg('warn',
          'This file subscribes to the design system rather than owning it, so only variables bound on the current page were found. Run this in the library file for an authoritative export.'));
      }

      if (m.warnings && m.warnings.length) {
        host.appendChild(msg('warn', 'Worth knowing before you link:', m.warnings));
      }

      // Tidiness of the file itself. Folded away: it never blocks an export,
      // and it is the only place these notes appear.
      if (m.hygiene && m.hygiene.length) {
        var tidy = document.createElement('details');
        tidy.className = 'msg';
        tidy.appendChild(el('summary', null, m.hygiene.length + ' tidy-up' + (m.hygiene.length === 1 ? '' : 's') +
          ' in this file (they don’t affect Unreal)'));
        var list = el('ul');
        m.hygiene.forEach(function (h) { list.appendChild(el('li', null, h)); });
        tidy.appendChild(list);
        host.appendChild(tidy);
      }

      // Refresh the checkbox list if the editor is open.
      if (!$('editor').classList.contains('hide')) {
        renderGroups(state.editing ? state.editing.published : ['Component']);
      }
      return;
    }

    if (m.type === 'links') {
      state.links = m.links;
      state.activeLinkId = m.activeLinkId;
      state.publications = m.publications || state.publications;
      renderLinks();
      renderPairings();  // a new or deleted link shows or hides "Link this project"
      if (m.saved) closeEditor();
      return;
    }

    if (m.type === 'published') {
      state.publications = m.publications || {};
      $('publishAll').disabled = false;
      renderLinks();

      var out = $('exportReport');
      clear(out);
      m.results.forEach(function (r) {
        out.appendChild(el('h2', null, 'Publish — ' + r.link.linkName));
        if (!r.ok) {
          out.appendChild(msg('err', 'Not published. Unreal keeps the previous publish until these are fixed:', r.errors));
        } else {
          out.appendChild(stat('Published to Unreal', r.publishedCount));
          out.appendChild(stat('Stored in total', r.total));
          var ok = el('div', 'msg ok');
          ok.appendChild(el('div', null,
            'Stored in this Figma file. Developers pick it up with Tools › Sync Design Tokens — nothing to send.'));
          out.appendChild(ok);
          if (r.readMode === 'consumer') {
            out.appendChild(msg('warn',
              'Read from a consuming file, so only variables bound on this page were published. Publish from the library file for the full set.'));
          }
        }
        if (r.warnings.length) out.appendChild(msg('warn', 'Warnings:', r.warnings));
      });
      return;
    }

    if (m.type === 'export') {
      state.doc = m.doc;
      var rep = $('exportReport');
      clear(rep);

      rep.appendChild(el('h2', null, 'Export — ' + m.link.linkName));
      rep.appendChild(stat('Target project', m.link.projectName || m.link.projectId));
      rep.appendChild(stat('Published to Unreal', m.publishedCount));
      rep.appendChild(stat('Exported in total', m.total));

      if (m.errors.length) {
        rep.appendChild(msg('err', 'Fix these before importing:', m.errors));
      } else {
        var note = el('div', 'msg ok');
        note.appendChild(el('div', null,
          m.publishedCount + ' tokens published; ' + (m.total - m.publishedCount) +
          ' exported unpublished so alias chains still resolve.'));
        rep.appendChild(note);

        var dl = el('button', 'wide', 'Download tokens.json');
        dl.style.marginTop = '9px';
        dl.onclick = function () {
          var blob = new Blob([JSON.stringify(state.doc, null, 2)], { type: 'application/json' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = (m.link.projectName || 'tokens').replace(/[^A-Za-z0-9._-]/g, '_') + '.tokens.json';
          a.click();
          URL.revokeObjectURL(a.href);
        };
        rep.appendChild(dl);
      }

      if (m.warnings.length) rep.appendChild(msg('warn', 'Warnings:', m.warnings));
      return;
    }

    if (m.type === 'error') {
      $('scan').disabled = false;
      $('scan').textContent = 'Scan this file';
      $('publishAll').disabled = false;
      renderLinks();  // re-enables any Publish button left saying "Publishing…"
      var target = $('editor').classList.contains('hide') ? $('exportReport') : $('editorMsg');
      clear(target);
      target.appendChild(msg('err', m.message, m.details));
      if (m.message.indexOf('project id') !== -1) $('projectId').classList.add('bad');
      if (m.message.indexOf('file key') !== -1) $('fileKey').classList.add('bad');
      return;
    }
  };

  send({ type: 'init' });
</script>
